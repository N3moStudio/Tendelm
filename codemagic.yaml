# Private, manually started builds. No publishing, notifications or automatic triggers.
workflows:
  tendelm-validated-ipa:
    name: Tendelm IPA from verified settings source
    instance_type: mac_mini_m2
    max_build_duration: 30
    environment:
      xcode: latest
    scripts:
      - name: Verify tested source and package Tendelm
        script: TENDELM_VERIFIED_PACKAGE_BASELINE=d205ded203d60346d0efa2b10048f1148b6b7e98 bash Scripts/build-personal.sh
    artifacts:
      - .build-personal-*/*.ipa
      - .build-personal-*/*.log
      - .build-personal-*/*.json
  tendelm-settings-checks:
    name: Tendelm settings simulator checks
    instance_type: mac_mini_m2
    max_build_duration: 60
    environment:
      xcode: latest
    scripts:
      - name: Validate settings without packaging
        script: bash Scripts/check-settings.sh
    artifacts:
      - .settings-check-*/*.log
      - .settings-check-*/*.json
      - .settings-check-*/*.txt
      - .settings-check-*/attachments/**/*
  tendelm-ipa:
    name: Tendelm private IPA
    instance_type: mac_mini_m2
    max_build_duration: 60
    environment:
      xcode: latest
    scripts:
      - name: Test and build Tendelm
        script: |
          #!/usr/bin/env bash
          set -euo pipefail
          bash Scripts/build-personal.sh
    artifacts:
      - .build-personal-*/*.ipa
      - .build-personal-*/*.log
      - .build-personal-*/*.json
      - .build-personal-*/*.xcresult.zip
      - .build-personal-*/attachments/**/*
