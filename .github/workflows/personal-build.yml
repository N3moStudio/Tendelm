name: Tendelm IPA
on:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: tendelm-personal
  cancel-in-progress: true
jobs:
  build:
    runs-on: macos-26
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - name: Select validated Xcode generation
        run: sudo xcode-select -s /Applications/Xcode_26.6.app/Contents/Developer
      - name: Build and verify unsigned IPA
        run: bash Scripts/package-personal.sh
      - name: Save IPA
        uses: actions/upload-artifact@v4
        with:
          name: Tendelm-IPA
          path: .build-personal-*/*.ipa
          include-hidden-files: true
          if-no-files-found: error
      - name: Save build evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: Tendelm-build-evidence
          include-hidden-files: true
          path: |
            .build-personal-*/*.log
            .build-personal-*/*.json
            .build-personal-*/attachments/**/*
          retention-days: 14

  validation:
    runs-on: macos-26
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - run: sudo xcode-select -s /Applications/Xcode_26.6.app/Contents/Developer
      - name: Simulator regression checks
        run: bash Scripts/check-settings.sh
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: Tendelm-simulator-evidence
          include-hidden-files: true
          path: |
            .settings-check-*/*.log
            .settings-check-*/*.json
            .settings-check-*/attachments/**/*
