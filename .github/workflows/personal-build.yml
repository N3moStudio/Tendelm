name: Tendelm IPA
on:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: tendelm-personal
  cancel-in-progress: false
jobs:
  build:
    runs-on: macos-26
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
      - name: Select validated Xcode generation
        run: sudo xcode-select -s /Applications/Xcode_26.6.app/Contents/Developer
      - name: Test and package unsigned IPA
        run: bash Scripts/build-personal.sh
      - name: Save IPA
        uses: actions/upload-artifact@v4
        with:
          name: Tendelm-IPA
          path: .build-personal-*/*.ipa
          include-hidden-files: true
          if-no-files-found: error
      - name: Save build evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: Tendelm-build-evidence
          include-hidden-files: true
          path: |
            .build-personal-*/*.log
            .build-personal-*/*.json
            .build-personal-*/attachments/**/*
          retention-days: 14
