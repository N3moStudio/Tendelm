name: Personal IPA
on:
  workflow_dispatch:
  push:
    branches: [personal]
permissions:
  contents: read
jobs:
  build:
    runs-on: macos-15
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - name: Select Xcode
        run: |
          ls -d /Applications/Xcode*.app
          DEVELOPER_APP=$(ls -d /Applications/Xcode_*.app | sort -V | tail -1)
          sudo xcode-select -s "$DEVELOPER_APP/Contents/Developer"
          xcodebuild -version
          xcrun simctl list devices available
      - name: Unit tests
        run: |
          mkdir -p output
          DEVICE_ID=$(xcrun simctl list devices available -j | python3 -c 'import json,sys; d=json.load(sys.stdin); print(next(v["udid"] for a in d["devices"].values() for v in a if "iPhone" in v["name"]))')
          echo "$DEVICE_ID" > output/simulator-id.txt
          set -o pipefail
          xcodebuild test -project Kado.xcodeproj -scheme Kado -destination "platform=iOS Simulator,id=$DEVICE_ID" -derivedDataPath build -resultBundlePath output/UnitTests.xcresult -only-testing:KadoTests CODE_SIGNING_ALLOWED=NO > output/unit-tests.log 2>&1 || { tail -100 output/unit-tests.log; exit 1; }
          tail -30 output/unit-tests.log
      - name: Device build and IPA
        run: |
          set -o pipefail
          xcodebuild build -project Kado.xcodeproj -scheme Kado -configuration Release -sdk iphoneos -destination 'generic/platform=iOS' -derivedDataPath device-build CODE_SIGNING_ALLOWED=NO > output/device-build.log 2>&1 || { tail -100 output/device-build.log; exit 1; }
          mkdir -p output/Payload
          cp -R device-build/Build/Products/Release-iphoneos/Kado.app output/Payload/
          cd output
          zip -qr Kado-Personal.ipa Payload
          shasum -a 256 Kado-Personal.ipa > Kado-Personal.ipa.sha256
          rm -rf Payload
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: Kado-Personal
          path: output/
          retention-days: 14
