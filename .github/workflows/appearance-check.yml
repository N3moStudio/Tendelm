name: Appearance diagnosis
on: workflow_dispatch
permissions:
  contents: read
jobs:
  check:
    runs-on: macos-15
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - name: Reproduce palette switching
        run: |
          DEVELOPER_APP=$(ls -d /Applications/Xcode_*.app | sort -V | tail -1)
          sudo xcode-select -s "$DEVELOPER_APP/Contents/Developer"
          mkdir -p output
          DEVICE_ID=$(xcrun simctl list devices available -j | python3 -c 'import json,sys; d=json.load(sys.stdin); print(next(v["udid"] for a in d["devices"].values() for v in a if "iPhone" in v["name"]))')
          xcodebuild test -project Tendelm.xcodeproj -scheme Tendelm -destination "platform=iOS Simulator,id=$DEVICE_ID" -derivedDataPath build -resultBundlePath output/Appearance.xcresult -only-testing:TendelmUITests/HabitThemePickerTests -parallel-testing-enabled NO CODE_SIGNING_ALLOWED=NO > output/appearance.log 2>&1 || { tail -80 output/appearance.log; exit 1; }
      - name: Export evidence
        if: always()
        run: |
          xcrun xcresulttool get test-results summary --path output/Appearance.xcresult --format json > output/Appearance-summary.json || true
          xcrun xcresulttool export attachments --path output/Appearance.xcresult --output-path output/Appearance-attachments || true
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: Tendelm
          path: output/
          retention-days: 14
