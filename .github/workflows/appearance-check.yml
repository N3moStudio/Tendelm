name: Focused regression checks
on:
  workflow_dispatch:
    inputs:
      suite:
        description: UI test class or method
        type: string
        default: PersonalEditionTests
      scheduled_mutation:
        description: Verify the countdown boundary test rejects an inverted condition
        type: boolean
        default: false
permissions:
  contents: read
jobs:
  check:
    runs-on: macos-15
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - name: Run focused interactions
        env:
          TEST_SCOPE: ${{ inputs.suite }}
          SCHEDULED_MUTATION: ${{ inputs.scheduled_mutation }}
        run: |
          DEVELOPER_APP=$(ls -d /Applications/Xcode_*.app | sort -V | tail -1)
          sudo xcode-select -s "$DEVELOPER_APP/Contents/Developer"
          mkdir -p output
          DEVICE_ID=$(xcrun simctl list devices available -j | python3 -c 'import json,sys; d=json.load(sys.stdin); print(next(v["udid"] for a in d["devices"].values() for v in a if "iPhone" in v["name"]))')
          echo "$DEVICE_ID" > output/simulator-id.txt
          if [ "$SCHEDULED_MUTATION" = "true" ]; then
            bash Scripts/check-reset-guard.sh scheduled
            git diff --exit-code -- Packages/TendelmCore/Sources/TendelmCore/Models/TimeSinceTracker.swift
            exit 0
          fi
          set -o pipefail
          xcodebuild test -project Tendelm.xcodeproj -scheme Tendelm -destination "platform=iOS Simulator,id=$DEVICE_ID" -derivedDataPath build -resultBundlePath output/Appearance.xcresult "-only-testing:TendelmUITests/$TEST_SCOPE" -parallel-testing-enabled NO -test-timeouts-enabled YES -default-test-execution-time-allowance 90 -maximum-test-execution-time-allowance 180 CODE_SIGNING_ALLOWED=NO 2>&1 | tee output/appearance.log
      - name: Export evidence
        if: always()
        run: |
          for result in output/*.xcresult; do
            [ -d "$result" ] || continue
            name=$(basename "$result" .xcresult)
            xcrun xcresulttool get test-results summary --path "$result" --format json > "output/$name-summary.json" || true
            xcrun xcresulttool export attachments --path "$result" --output-path "output/$name-attachments" || true
          done
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: Tendelm
          path: output/
          retention-days: 14
