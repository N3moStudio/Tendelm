name: Focused regression checks
on:
  workflow_dispatch:
    inputs:
      suite:
        description: UI test class or method
        type: string
        default: PersonalEditionTests
      scheduled_mutation:
        description: Verify the countdown boundary test rejects an inverted condition
        type: boolean
        default: false
permissions:
  contents: read
jobs:
  check:
    runs-on: macos-26
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
      - name: Run focused interactions
        env:
          TEST_SCOPE: ${{ inputs.suite }}
          SCHEDULED_MUTATION: ${{ inputs.scheduled_mutation }}
        run: |
          sudo xcode-select -s /Applications/Xcode_26.6.app/Contents/Developer
          if [ "$TEST_SCOPE" = "reordering" ] || [ "$TEST_SCOPE" = "reordering-ui" ]; then
            bash Scripts/check-settings.sh "$TEST_SCOPE"
            exit 0
          fi
          if [ "$TEST_SCOPE" = "release-ipad" ]; then
            bash Scripts/check-settings.sh ipad
            exit 0
          fi
          if [ "$TEST_SCOPE" = "release-recovery" ]; then
            bash Scripts/check-settings.sh recovery
            exit 0
          fi
          mkdir -p output
          DEVICE_ID=$(xcrun simctl list devices available -j | python3 -c 'import json,sys; d=json.load(sys.stdin); a=[v for vs in d["devices"].values() for v in vs if "iPhone" in v["name"]]; print(next((v["udid"] for v in a if "16e" in v["name"]),a[0]["udid"]))')
          echo "$DEVICE_ID" > output/simulator-id.txt
          if [ "$SCHEDULED_MUTATION" = "true" ]; then
            bash Scripts/check-reset-guard.sh scheduled
            git diff --exit-code -- Packages/TendelmCore/Sources/TendelmCore/Models/TimeSinceTracker.swift
            exit 0
          fi
          xcrun simctl boot "$DEVICE_ID" 2>/dev/null || true
          xcrun simctl bootstatus "$DEVICE_ID" -b
          set -o pipefail
          xcodebuild test -project Tendelm.xcodeproj -scheme Tendelm -destination "platform=iOS Simulator,id=$DEVICE_ID" -derivedDataPath build -resultBundlePath output/Appearance.xcresult "-only-testing:TendelmUITests/$TEST_SCOPE" -parallel-testing-enabled NO -test-timeouts-enabled YES -default-test-execution-time-allowance 360 -maximum-test-execution-time-allowance 420 CODE_SIGNING_ALLOWED=NO 2>&1 | tee output/appearance.log
      - name: Export evidence
        if: always()
        run: |
          for result in output/*.xcresult; do
            [ -d "$result" ] || continue
            name=$(basename "$result" .xcresult)
            xcrun xcresulttool get test-results summary --path "$result" --format json > "output/$name-summary.json" || true
            xcrun xcresulttool export attachments --path "$result" --output-path "output/$name-attachments" || true
          done
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: Tendelm
          include-hidden-files: true
          path: |
            output/
            .settings-check-*/*.log
            .settings-check-*/*.json
            .settings-check-*/attachments/**/*
          retention-days: 14
